[package]
name = "sable"
version = "0.3.8"
description = "Sable — a fast, minimal, dark code editor"
authors = ["Riaan Mathur"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sable"
path = "src/main.rs"
required-features = ["desktop"]

# The remote agent (agent/): runs on an SSH host, in WSL or in a
# container and serves the workspace commands over stdin/stdout (see
# src/agent.rs). Its own package, so the app's installers don't carry it:
#   cargo build --release -p sable-agent
[workspace]
members = ["agent"]

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-updater",
  "dep:keyring",
  "dep:fontdb",
  "dep:ttf-parser",
  "dep:flate2",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = { version = "2.7.1", optional = true }
notify = "8.2.0"
portable-pty = "0.9.0"
ignore = "0.4.26"
grep-searcher = "0.1.16"
grep-regex = "0.1.14"
tokio = { version = "1.52.3", features = ["process", "io-util", "io-std", "sync", "rt", "rt-multi-thread", "macros", "time", "net"] }
lsp-types = "0.97.0"
# Local repository work only (fetch/pull/push run the git CLI), so no
# HTTPS/SSH transports — and no OpenSSL to link into the agent.
git2 = { version = "0.21.0", default-features = false }
reqwest = { version = "0.13", features = ["json", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"], optional = true }
fontdb = { version = "0.24.0", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
grep-matcher = "0.1.8"
futures-util = "0.3.32"
tauri-plugin-opener = { version = "2.7.0", optional = true }
base64 = "0.23.1"
flate2 = { version = "1", optional = true }
# SQLite databases (database.rs): the C library built in, so the remote
# agent needs no system SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = { version = "2.4.0", optional = true }
tauri-plugin-updater = { version = "2.13.2", optional = true }

