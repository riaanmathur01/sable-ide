[package]
name = "sable"
version = "0.3.4"
description = "Sable — a fast, minimal, dark code editor"
authors = ["Riaan Mathur"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
notify = "8.2.0"
portable-pty = "0.9.0"
ignore = "0.4.26"
grep-searcher = "0.1.16"
grep-regex = "0.1.14"
tokio = { version = "1.52.3", features = ["process", "io-util", "sync", "rt", "macros", "time", "net"] }
lsp-types = "0.97.0"
git2 = "0.21.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
fontdb = "0.24.0"
ttf-parser = "0.25.1"
grep-matcher = "0.1.8"
futures-util = "0.3.32"
tauri-plugin-opener = "2.7.0"
base64 = "0.23.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.2"

