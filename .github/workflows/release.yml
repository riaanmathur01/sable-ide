# Builds Sable's installers for macOS, Windows and Linux, each named for
# the computer it's for (Sable_0.3.2_macOS_Apple-Silicon.dmg, …), and
# publishes them (with the updater's signed archives and latest.json) as a
# GitHub release once every platform has built. Run it by pushing a tag:
#
#   git tag v0.3.2 && git push origin v0.3.2
#
# Installed copies of Sable update from the latest published release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           required: the updater key
#                                       (~/.tauri/sable-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if none)
#   macOS signing + notarization (optional; without them macOS users must
#   right-click → Open the first time):
#     APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows signing is optional too (without it SmartScreen warns once).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `label` names the files: Sable_<version>_<label>.<ext>.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            label: macOS_Apple-Silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            label: macOS_Intel
          - platform: windows-latest
            args: ""
            label: Windows_x64
          - platform: ubuntu-22.04
            args: ""
            label: Linux_x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Signing settings reach the build only when the certificate is set:
      # an empty APPLE_CERTIFICATE makes Tauri try (and fail) to import it.
      # Without them the Mac app is built unsigned.
      - name: macOS signing (when configured)
        if: matrix.platform == 'macos-latest'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "No APPLE_CERTIFICATE secret: building an unsigned Mac app."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          # The frontend build (Monaco, Shiki grammars) outgrows Node's
          # default heap on the macOS runners.
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sable ${{ github.ref_name }}
          releaseBody: |
            ## Download

            | Your computer | File |
            | --- | --- |
            | Mac with Apple silicon (M1 or later) | `…_macOS_Apple-Silicon.dmg` |
            | Mac with an Intel processor | `…_macOS_Intel.dmg` |
            | Windows 10/11, 64-bit | `…_Windows_x64-setup.exe` (or the `.msi`) |
            | Linux, Debian / Ubuntu | `…_Linux_x64.deb` |
            | Linux, Fedora / RHEL / openSUSE | `…_Linux_x64.rpm` |
            | Linux, any distribution | `…_Linux_x64.AppImage` |

            The `.app.tar.gz`, `.sig` and `latest.json` files are for automatic updates, and the `sable-agent-…` files for remote development (Sable fetches them itself) — you don't need them.

            The apps aren't code-signed yet: on macOS, right-click Sable → Open the first time (or System Settings → Privacy & Security → Open Anyway); on Windows, SmartScreen → More info → Run anyway.

            See the commits since the last release for what changed.
          # Published by the `publish` job once every platform has built.
          releaseDraft: true
          prerelease: false
          # latest.json, which installed copies check for updates.
          includeUpdaterJson: true
          # Files named for the computer they're for.
          assetNamePattern: "[name]_[version]_${{ matrix.label }}[setup][ext]"
          args: ${{ matrix.args }}

  # Sable's remote agent for each kind of machine it runs on (SSH hosts,
  # WSL, containers): static Linux builds (cross-compiled with zig, so they
  # run on any distribution, Alpine included) and macOS builds. The app
  # downloads the one a remote needs from the release
  # (src-tauri/src/remote.rs).
  agents:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: agent-${{ matrix.target }}

      - name: zig, to cross-compile the static Linux agent
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the agent
        working-directory: src-tauri
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --release -p sable-agent --target ${{ matrix.target }}
          else
            cargo build --release -p sable-agent --target ${{ matrix.target }}
          fi
          gzip -9 -c target/${{ matrix.target }}/release/sable-agent > ../sable-agent-${{ matrix.platform }}.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sable-agent-${{ matrix.platform }}
          path: sable-agent-${{ matrix.platform }}.gz
          if-no-files-found: error

  # Add the agents, then publish the draft once every installer is in it
  # (a failed build leaves it a draft, so installed copies never see a
  # half-finished release).
  publish:
    needs: [build, agents]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sable-agent-*
          path: agents
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" agents/sable-agent-*.gz --repo "${{ github.repository }}" --clobber
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
